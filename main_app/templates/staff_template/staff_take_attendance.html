{% extends 'main_app/base.html' %}
{% load static %}
{% block page_title %}{{page_title}}{% endblock page_title %}
{% block content %}

<section class="content">
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-12">
                <!-- general form elements -->
                <div class="card card-dark">
                    <div class="card-header">
                        <h3 class="card-title">{{page_title}}</h3>
                    </div>

                    <!-- /.card-header -->
                    <!-- form start -->
                    <div class="card-body">



                        <div class="form-group">
                            <label for="course">Course</label>
                            <select name="course" class="form-control" id="course">
                                <option value="">Choose course</option>
                                {% for course in courses %}<option value="{{ course.id }}">{{ course.name }}</option>{% endfor %}
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="semester">Semester</label>
                            <select name="semester" class="form-control" id="semester" disabled>
                                <option value="">Choose semester</option>
                                {% for semester in semesters %}<option value="{{ semester.id }}" data-course="{{ semester.course_id }}">{{ semester.course.name }} · {{ semester.name }}</option>{% endfor %}
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="subject">Assigned subject</label>
                            <select name="subject" class="form-control" id="subject" disabled>
                                <option value="">Choose subject</option>
                                {% for subject in subjects %}<option value="{{ subject.id }}" data-course="{{ subject.course_id }}" data-semester="{{ subject.semester_id }}">{% if subject.code %}{{ subject.code }} — {% endif %}{{ subject.name }}</option>{% endfor %}
                            </select>
                        </div>


                        <div class="form-group">
                            <label>Session Year</label>
                            <select name="session" id='session' class="form-control">
                                <option value="">----</option>
                                {% for session in sessions  %}
                                <option value="{{session.id}}">{{session}} </option>
                                {% endfor %}
                            </select>
                        </div>
                        {% comment %}

                        <div>
                            <label>Attendance Date</label>
                            <input type="date" class='form-control' name="attendance_date" id='attendance_date' id="">
                        </div>
                        {% endcomment %}

                    </div>
                    <!-- /.card-body -->

                    <div class="card-footer">
                        <button type="button" id='fetch_student' class="btn btn-success">Take attendance</button>
                        <button type="button" id='find_existing_attendance' class="btn btn-outline-primary">Load an existing class record</button>
                        <div class="row g-2 mt-2" id="existing-attendance-controls" hidden><div class="col-md-8"><select id="existing-attendance-date" class="form-control"><option value="">Choose a saved attendance date</option></select></div><div class="col-md-4"><button type="button" id="load-existing-attendance" class="btn btn-outline-secondary w-100">Edit selected date</button></div></div>
                        <div class="form-group" id="student_data">

                        </div>
                    </div>
                </div>
                <!-- /.card -->

            </div>
        </div>
    </div>
</section>
{% endblock content %}


{% block custom_js %}
<script>
    function escapeHtml(value) { return String(value).replace(/[&<>"']/g, function (char) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]); }); }
    function setAttendanceButtonBusy(button, busy, label) {
        var element = $(button);
        if (busy) {
            element.data('idleHtml', element.html()).prop('disabled', true)
                .html("<span class='spinner-border spinner-border-sm me-2' role='status' aria-hidden='true'></span>" + label);
        } else {
            element.prop('disabled', false).html(element.data('idleHtml') || label);
        }
    }
    $(document).ready(function () {
        var selectedAttendanceId = null;
        function refreshAttendanceChoices() {
            var courseId = $("#course").val();
            var semesterId = $("#semester").val();
            $("#semester option").each(function () {
                var visible = !this.value || $(this).data("course") == courseId;
                $(this).prop("hidden", !visible);
            });
            $("#subject option").each(function () {
                var visible = !this.value || ($(this).data("course") == courseId && $(this).data("semester") == semesterId);
                $(this).prop("hidden", !visible);
            });
            if (!courseId) { $("#semester").val("").prop("disabled", true); }
            else { $("#semester").prop("disabled", false); }
            if (!courseId || !semesterId) { $("#subject").val("").prop("disabled", true); }
            else { $("#subject").prop("disabled", false); }
        }
        $("#course").on("change", function () { $("#semester, #subject").val(""); refreshAttendanceChoices(); });
        $("#semester").on("change", function () { $("#subject").val(""); refreshAttendanceChoices(); });
        refreshAttendanceChoices();

        $("#find_existing_attendance").on("click", function () {
            var button = this;
            var course = $("#course").val(), semester = $("#semester").val(), subject = $("#subject").val(), session = $("#session").val();
            if (!course || !semester || !subject || !session) { alert("Select course, semester, subject, and session first."); return; }
            setAttendanceButtonBusy(button, true, "Loading saved dates…");
            $.post("{% url 'get_attendance' %}", {subject: subject, session: session}).done(function (rows) {
                rows = typeof rows === "string" ? JSON.parse(rows) : rows;
                rows = (rows || []).filter(function (row) { return !row.semester || String(row.semester) === String(semester); });
                $("#existing-attendance-date").html('<option value="">Choose a saved attendance date</option>' + rows.map(function (row) { return '<option value="' + Number(row.id) + '">' + escapeHtml(row.attendance_date) + '</option>'; }).join(""));
                $("#existing-attendance-controls").prop("hidden", !rows.length);
                if (!rows.length) alert("No saved class attendance was found for these selections.");
            }).fail(function () { alert("Could not load saved attendance records."); }).always(function () { setAttendanceButtonBusy(button, false); });
        });

        $("#load-existing-attendance").on("click", function () {
            var button = this;
            selectedAttendanceId = $("#existing-attendance-date").val();
            if (!selectedAttendanceId) { alert("Choose an attendance date."); return; }
            setAttendanceButtonBusy(button, true, "Loading attendance…");
            $.post("{% url 'get_student_attendance' %}", {attendance_date_id: selectedAttendanceId}).done(function (rows) {
                rows = typeof rows === "string" ? JSON.parse(rows) : rows;
                if (!rows.length) { $("#student_data").html("<p class='text-muted mt-3'>There are no attendance entries on this date.</p>"); return; }
                var html = "<hr/><div class='d-flex flex-wrap align-items-center gap-2 mb-2'><strong class='me-auto'>Edit attendance · " + rows.length + " students</strong><button type='button' class='btn btn-sm btn-outline-success mark-all' data-status='present'>Mark all present</button><button type='button' class='btn btn-sm btn-outline-secondary mark-all' data-status='absent'>Mark all absent</button></div><div class='table-responsive'><table class='table table-hover align-middle'><thead><tr><th>Student</th><th>Attendance status</th></tr></thead><tbody>";
                rows.forEach(function (row) { var name=escapeHtml(row.name), id=Number(row.id), status=row.attendance_status||"absent"; html += "<tr><td><input type='hidden' class='student-id' value='"+id+"'>"+name+"</td><td><select class='form-control attendance-status' aria-label='Attendance status for "+name+"'><option value='present' "+(status==='present'?'selected':'')+">Present</option><option value='absent' "+(status==='absent'?'selected':'')+">Absent</option><option value='late' "+(status==='late'?'selected':'')+">Late</option><option value='excused' "+(status==='excused'?'selected':'')+">Excused</option></select></td></tr>"; });
                html += "</tbody></table></div><button id='save_attendance' class='btn btn-primary' type='button'>Save attendance changes</button>"; $("#student_data").html(html);
            }).fail(function () { alert("Could not load the selected attendance roster."); }).always(function () { setAttendanceButtonBusy(button, false); });
        });

        $("#fetch_student").click(function () {
            var button = this;
            selectedAttendanceId = null;
            var course = $("#course").val()
            var semester = $("#semester").val()
            var subject = $("#subject").val()
            var session = $("#session").val()
            $("#student_data").empty();
            if (!course || !semester || !subject || !session){
                alert("Please select course, semester, assigned subject, and academic session");
                return false;
            }
            setAttendanceButtonBusy(button, true, "Loading students…");
            $("#student_data").html("<div class='alert alert-info mt-3' role='status'><span class='spinner-border spinner-border-sm me-2' aria-hidden='true'></span>Loading the selected class list…</div>");
            $.ajax({
                url: "{% url 'get_students' %}",
                type: 'POST',
                data: {
                    course: course,
                    semester: semester,
                    subject: subject,
                    session: session
                }
            }).done(function (response) {
                var json_data = typeof response === "string" ? JSON.parse(response) : response
                if (json_data.length < 1) {
                    $("#student_data").html("<div class='alert alert-warning mt-3'>No students are registered for this course, semester, and session.</div>");
                } else {
                    var div_data = "<hr/><div class='row'><div class='col-md-6 form-group'><label>Class Date</label><input type='date' class='form-control' name='attendance_date' id='attendance_date' required></div><div class='col-md-6 form-group'><label>Topic / Lesson</label><input type='text' maxlength='180' class='form-control' id='class_topic' placeholder='What was covered?'></div><div class='col-md-6 form-group'><label>Starts</label><input type='time' class='form-control' id='starts_at'></div><div class='col-md-6 form-group'><label>Ends</label><input type='time' class='form-control' id='ends_at'></div></div><div class='d-flex flex-wrap align-items-center gap-2 mb-2'><strong class='me-auto'>" + json_data.length + " students</strong><button type='button' class='btn btn-sm btn-outline-success mark-all' data-status='present'>Mark all present</button><button type='button' class='btn btn-sm btn-outline-secondary mark-all' data-status='absent'>Mark all absent</button></div><div class='table-responsive'><table class='table table-hover align-middle'><thead><tr><th>Student</th><th style='min-width:180px'>Attendance status</th></tr></thead><tbody>"

                    for (key in json_data) {
                        var studentId = Number(json_data[key]['id']);
                        var studentName = escapeHtml(json_data[key]['name']);
                        div_data += "<tr><td><input type='hidden' class='student-id' value='" + studentId + "'>" + studentName + "</td><td><select aria-label='Attendance status for " + studentName + "' class='form-control attendance-status'><option value='present'>Present</option><option value='absent'>Absent</option><option value='late'>Late</option><option value='excused'>Excused</option></select></td></tr>"
                    }
                    div_data += "</tbody></table></div>"
                    div_data += "<div class='form-group'><button id='save_attendance' class='btn btn-success' type='button'>Save Attendance</button></div>"
                    $("#student_data").html(div_data)
                }
            }).fail(function (response) {
                var message = response.responseJSON && response.responseJSON.error;
                $("#student_data").html("<div class='alert alert-danger mt-3'>" + escapeHtml(message || "Could not load the student list. Please try again.") + "</div>");
            }).always(function () { setAttendanceButtonBusy(button, false); });
        })
        $(document).off("click", ".mark-all").on("click", ".mark-all", function () {
            $(".attendance-status").val($(this).data("status"));
        });
        $(document).off('click', '#save_attendance').on('click', '#save_attendance', function () {
            var course=$("#course").val(), semester=$("#semester").val(), subject=$("#subject").val(), session=$("#session").val();
            var attendanceDate=$("#attendance_date").val();
            if (!selectedAttendanceId && !attendanceDate) { alert("Select the class date."); return; }
            var studentData=$('.student-id').map(function(){return {id:$(this).val(),status:$(this).closest('tr').find('.attendance-status').val()};}).get();
            var button=$(this).prop("disabled",true).text("Saving...");
            $.ajax({url:selectedAttendanceId?"{% url 'update_attendance' %}":"{% url 'save_attendance' %}",type:"POST",data:{date:selectedAttendanceId||attendanceDate,student_ids:JSON.stringify(studentData),subject:subject,course:course,semester:semester,session:session,class_topic:$('#class_topic').val(),starts_at:$('#starts_at').val(),ends_at:$('#ends_at').val()}})
                .done(function(){alert("Attendance saved.");location.reload();})
                .fail(function(xhr){button.prop("disabled",false).text("Save attendance changes");alert(xhr.responseJSON?.error||"Could not save attendance. Please try again.");});
        });
    })
</script>
{% endblock custom_js %}
